name = "icp-api"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# Production secrets are set via `wrangler secret put` (never in this file)
# DATABASE_URL, SESSION_SECRET, JWT_SECRET must be set as Cloudflare secrets

# Local development vars (only used by `wrangler dev`)
[env.development]
vars = { ENVIRONMENT = "development" }
# To use local dev secrets, create a .dev.vars file with:
# DATABASE_URL = "postgresql://..."
# SESSION_SECRET = "dev-secret"

# R2 storage binding (uncomment when ready):
# [[r2_buckets]]
# binding = "STORAGE"
# bucket_name = "icp-storage"
